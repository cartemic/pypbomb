[project]
name = "pypbomb"
version = "2.0.0"
description = "Tools for designing a detonation tube"
authors = [{ name = "Mick Carter", email = "cartemic@proton.me" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "Private :: Do Not Upload",               # todo: remove this once things are ready
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = ["cantera>=3.1.0", "numpy~=2.1.2", "pint~=0.24.3"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6.1",
  "ipython>=9.5.0",
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "pyright>=1.1.404",
  "ruff>=0.12.11",
]

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"_validate.py" = ["E741"]        # short variable names are nice in these functions
